<rect x="150" y="406" width="30" height="16" rx="4" fill="#ececec"/>
<text x="165.0" y="418" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LOG</text>
<text x="190" y="418" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">a record to keep for each interaction</text>
<rect x="600" y="406" width="24" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="636" y="417" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">the questions an investigation must answer</text>
